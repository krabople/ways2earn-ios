name: Build signed iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo-doctor
      - name: Build signed IPA using EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
        run: npx eas-cli@latest build --platform ios --profile production --non-interactive --wait --json > eas-build.json
      - name: Download IPA
        run: |
          BUILD_URL=$(jq -r '.[0].artifacts.buildUrl' eas-build.json)
          test "$BUILD_URL" != "null"
          curl --fail --location "$BUILD_URL" --output Ways2Earn.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Ways2Earn-iOS
          path: Ways2Earn.ipa
          if-no-files-found: error
          retention-days: 14
