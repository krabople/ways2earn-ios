name: Quizfolk TestFlight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify_ios:
    uses: krabople/Quizfolk-iOS/.github/workflows/ios.yml@4469bc129c929552fb04cd0c4631a70932f2d339
    with:
      source_ref: 4469bc129c929552fb04cd0c4631a70932f2d339
  quizfolk:
    needs: verify_ios
    uses: krabople/Quizfolk-iOS/.github/workflows/testflight.yml@4469bc129c929552fb04cd0c4631a70932f2d339
    with:
      source_ref: 4469bc129c929552fb04cd0c4631a70932f2d339
    secrets:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
