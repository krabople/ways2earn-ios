name: Quizfolk TestFlight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify_ios:
    uses: krabople/Quizfolk-iOS/.github/workflows/ios.yml@cf00d91a7b25b6941b98a2f1ecf4b98dbdedb9f3
    with:
      source_ref: cf00d91a7b25b6941b98a2f1ecf4b98dbdedb9f3
  quizfolk:
    needs: verify_ios
    uses: krabople/Quizfolk-iOS/.github/workflows/testflight.yml@cf00d91a7b25b6941b98a2f1ecf4b98dbdedb9f3
    with:
      source_ref: cf00d91a7b25b6941b98a2f1ecf4b98dbdedb9f3
    secrets:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
