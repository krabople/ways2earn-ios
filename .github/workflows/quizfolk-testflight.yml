name: Quizfolk TestFlight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify_ios:
    uses: krabople/Quizfolk-iOS/.github/workflows/ios.yml@42cec05b5b9cec914c422c3a335ed59addf01df8
    with:
      source_ref: 42cec05b5b9cec914c422c3a335ed59addf01df8
  quizfolk:
    needs: verify_ios
    uses: krabople/Quizfolk-iOS/.github/workflows/testflight.yml@42cec05b5b9cec914c422c3a335ed59addf01df8
    with:
      source_ref: 42cec05b5b9cec914c422c3a335ed59addf01df8
    secrets:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
