name: Quizfolk TestFlight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify_ios:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify the successful tests for this exact source revision
        run: |
          python3 - <<'PY'
          import json, urllib.request, time
          deadline=time.monotonic()+1600
          while time.monotonic()<deadline:
              with urllib.request.urlopen('https://api.github.com/repos/krabople/Quizfolk-iOS/actions/runs/42079782281',timeout=30) as r:
                  result=json.load(r)
              assert result['head_sha']=='88a3dc0f201f029660b875b0b60b53386d94974d', 'Unexpected iOS source revision'
              if result['status']=='completed':
                  assert result['conclusion']=='success', 'The exact iOS source must pass all simulator checks before signing'
                  print('Exact iOS source passed all simulator tests');break
              time.sleep(45)
          else:raise SystemExit('The iOS checks are still pending; retry this verification job after they finish')
          PY
  quizfolk:
    needs: verify_ios
    uses: krabople/Quizfolk-iOS/.github/workflows/testflight.yml@88a3dc0f201f029660b875b0b60b53386d94974d
    with:
      source_ref: 88a3dc0f201f029660b875b0b60b53386d94974d
    secrets:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
