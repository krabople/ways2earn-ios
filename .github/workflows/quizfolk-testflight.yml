name: Quizfolk TestFlight
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify_ios:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify the successful tests for this exact source revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, urllib.request, time, os
          deadline=time.monotonic()+1600
          while time.monotonic()<deadline:
              request=urllib.request.Request('https://api.github.com/repos/krabople/Quizfolk-iOS/actions/runs/42262841976',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'Quizfolk-release-check'})
              with urllib.request.urlopen(request,timeout=30) as r:
                  result=json.load(r)
              assert result['head_sha']=='960d39fc04f1c91cb5a63ac1c9784022e494be37', 'Unexpected iOS source revision'
              if result['status']=='completed':
                  assert result['conclusion']=='success', 'The exact iOS source must pass all simulator checks before signing'
                  print('Exact iOS source passed all simulator tests');break
              time.sleep(45)
          else:raise SystemExit('The iOS checks are still pending; retry this verification job after they finish')
          PY
  quizfolk:
    needs: verify_ios
    uses: krabople/Quizfolk-iOS/.github/workflows/testflight.yml@960d39fc04f1c91cb5a63ac1c9784022e494be37
    with:
      source_ref: 960d39fc04f1c91cb5a63ac1c9784022e494be37
    secrets:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
