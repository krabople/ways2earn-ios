name: Quizfolk TestFlight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify_ios:
    uses: krabople/Quizfolk-iOS/.github/workflows/ios.yml@2a7f393d312dd76b0ab3f25e5b1bb948e7e2d170
    with:
      source_ref: 2a7f393d312dd76b0ab3f25e5b1bb948e7e2d170
  quizfolk:
    needs: verify_ios
    uses: krabople/Quizfolk-iOS/.github/workflows/testflight.yml@2a7f393d312dd76b0ab3f25e5b1bb948e7e2d170
    with:
      source_ref: 2a7f393d312dd76b0ab3f25e5b1bb948e7e2d170
    secrets:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
